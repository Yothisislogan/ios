name: RiseAndShine
options:
  bundleIdPrefix: com.weinsurethings
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here (or in Xcode > Signing & Capabilities) before running on device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  RiseAndShine:
    type: application
    platform: iOS
    sources:
      - path: RiseAndShine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weinsurethings.RiseAndShine
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rise & Shine
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  RiseAndShineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RiseAndShineTests
    dependencies:
      - target: RiseAndShine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weinsurethings.RiseAndShine.tests
        GENERATE_INFOPLIST_FILE: YES
